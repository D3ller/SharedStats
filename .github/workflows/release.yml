name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: MODRINTH_TOKEN

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check the release version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          gradle_version="$(./gradlew properties -q | sed -n 's/^version: //p')"

          if [[ "$tag_version" != "$gradle_version" ]]; then
            echo "Tag version $tag_version does not match Gradle version $gradle_version."
            exit 1
          fi

      - name: Build the plugin
        run: ./gradlew build

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub release $GITHUB_REF_NAME already exists."
            exit 0
          fi

          notes_file=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [[ -f "$notes_file" ]]; then
            gh release create "$GITHUB_REF_NAME" build/libs/*.jar \
              --verify-tag --notes-file "$notes_file" --title "$GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" build/libs/*.jar \
              --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi

      - name: Publish the Modrinth version
        env:
          GH_TOKEN: ${{ github.token }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          test -n "$MODRINTH_TOKEN"
          MODRINTH_CHANGELOG="$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)" \
            ./gradlew modrinth
