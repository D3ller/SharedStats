name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: MODRINTH_TOKEN

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check the release version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          gradle_version="$(./gradlew properties -q | sed -n 's/^version: //p')"

          if [[ "$tag_version" != "$gradle_version" ]]; then
            echo "Tag version $tag_version does not match Gradle version $gradle_version."
            exit 1
          fi

      - name: Build the plugin
        run: ./gradlew build

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub release $GITHUB_REF_NAME already exists."
            exit 0
          fi

          notes_file=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [[ -f "$notes_file" ]]; then
            gh release create "$GITHUB_REF_NAME" build/libs/*.jar \
              --verify-tag --notes-file "$notes_file" --title "$GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" build/libs/*.jar \
              --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi

      - name: Read the release changelog
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "jar=$(ls build/libs/*.jar)"
            echo "changelog<<CHANGELOG_EOF"
            gh release view "$GITHUB_REF_NAME" --json body --jq .body
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish the Modrinth version
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_CHANGELOG: ${{ steps.release.outputs.changelog }}
        run: |
          test -n "$MODRINTH_TOKEN"
          ./gradlew modrinth

      - name: Publish the CurseForge file
        uses: itsmeow/curseforge-upload@v3.1.2
        with:
          token: ${{ secrets.CF_API_TOKEN }}
          project_id: "1741500"
          game_endpoint: bukkit
          game_versions: "26.2"
          file_path: ${{ steps.release.outputs.jar }}
          display_name: SharedStats ${{ github.ref_name }}
          release_type: release
          changelog: ${{ steps.release.outputs.changelog }}
          changelog_type: markdown
